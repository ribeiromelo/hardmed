<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: white;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #666;
        }
        input {
            background: #333;
            color: white;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #764ba2;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #10b981;
            display: block !important;
        }
        .error {
            background: #ef4444;
            display: block !important;
        }
        .info {
            background: #3b82f6;
            display: block !important;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Login</h1>
    
    <form id="testForm">
        <input type="email" id="email" placeholder="Email" value="admin@hardmedicina.com">
        <input type="password" id="password" placeholder="Senha" value="admin123">
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <div style="margin-top: 20px; font-size: 12px; color: #888;">
        <p><strong>Credenciais de teste:</strong></p>
        <p>Admin: admin@hardmedicina.com / admin123</p>
        <p>Student: erique@exemplo.com / admin123</p>
    </div>

    <script>
        const resultDiv = document.getElementById('result');
        
        function showResult(message, type) {
            resultDiv.textContent = message;
            resultDiv.className = type;
        }
        
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            showResult('Fazendo login...', 'info');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (!response.ok) {
                    showResult('❌ Erro: ' + (result.error || 'Login falhou'), 'error');
                    return;
                }
                
                // Save token as cookie
                const expiryDate = new Date();
                expiryDate.setDate(expiryDate.getDate() + 7);
                document.cookie = `auth_token=${result.token}; path=/; expires=${expiryDate.toUTCString()}; SameSite=Lax`;
                
                showResult('✅ Login bem-sucedido! Token: ' + result.token.substring(0, 30) + '...', 'success');
                
                // Test dashboard access
                setTimeout(async () => {
                    showResult('🔄 Testando acesso ao dashboard...', 'info');
                    
                    try {
                        const dashResponse = await fetch('/dashboard', {
                            redirect: 'manual'
                        });
                        
                        if (dashResponse.status === 200) {
                            showResult('✅ Dashboard acessível! Redirecionando...', 'success');
                            setTimeout(() => {
                                window.location.href = '/dashboard';
                            }, 1000);
                        } else if (dashResponse.status === 0 || dashResponse.type === 'opaqueredirect') {
                            showResult('⚠️ Redirecionado. Acessando dashboard...', 'info');
                            window.location.href = '/dashboard';
                        } else {
                            showResult('❌ Dashboard não acessível. Status: ' + dashResponse.status, 'error');
                        }
                    } catch (err) {
                        showResult('❌ Erro ao testar dashboard: ' + err.message, 'error');
                    }
                }, 2000);
                
            } catch (error) {
                showResult('❌ Erro na requisição: ' + error.message, 'error');
            }
        });
        
        // Show current cookie on load
        window.addEventListener('load', () => {
            const cookie = document.cookie.match(/auth_token=([^;]+)/);
            if (cookie) {
                showResult('ℹ️ Token existente encontrado: ' + cookie[1].substring(0, 30) + '...', 'info');
            }
        });
    </script>
</body>
</html>
